<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algonetic | BCA Code Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgb(240, 242, 245);
            --header-rgb: linear-gradient(135deg, rgb(15, 12, 41), rgb(48, 43, 99), rgb(36, 36, 62));
            --card-sem12: linear-gradient(135deg, rgb(0, 184, 148), rgb(85, 239, 196));
            --card-sem34: linear-gradient(135deg, rgb(108, 92, 231), rgb(162, 155, 254));
            --algo-rgb: rgb(232, 244, 255);
            --algo-border: rgb(0, 122, 255);
            --code-header: rgb(45, 52, 54);
            --explain-rgb: rgb(255, 240, 240);
            --explain-border: rgb(255, 118, 117);
            --video-rgb: rgb(255, 250, 230);
            --video-border: rgb(253, 203, 110);
            --navy-blue: #0f172a;
            --bright-purple: #7c3aed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: #2d3436; min-height: 100vh; position: relative; }

        /* BACKGROUND ANIMATION */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: var(--bg-color); }
        .blob { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(124, 58, 237, 0.12) 0%, transparent 70%); border-radius: 50%; animation: move 20s infinite alternate ease-in-out; }
        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(0, 122, 255, 0.12) 0%, transparent 70%); animation-duration: 25s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(100px, 100px) scale(1.1); } }

        /* HEADER */
        header { 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); padding: 2rem 1rem; text-align: center; 
            border-bottom: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-size: 2.8rem; font-weight: 800; letter-spacing: -1.5px; background: linear-gradient(to right, var(--navy-blue), var(--bright-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 850px; margin: 2rem auto 50px; padding: 0 20px; position: relative; z-index: 1; }

        .back-btn { display: none; padding: 12px 25px; margin-bottom: 20px; cursor: pointer; background: white; border: none; border-radius: 15px; font-weight: 600; color: #302b63; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); padding: 2.5rem; border-radius: 25px; 
            text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: var(--bright-purple); }
        .card h3 { font-size: 1.5rem; margin-bottom: 5px; color: #1e293b; }
        .sem-card h3 { color: white; }
        .sem12 { background: var(--card-sem12); }
        .sem34 { background: var(--card-sem34); }

        /* DASHBOARD STYLES */
        .info-header { margin-top: 50px; font-weight: 700; color: var(--navy-blue); margin-bottom: 20px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .extra-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .info-card { background: white; padding: 20px; border-radius: 20px; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .info-card h4 { color: var(--bright-purple); margin-bottom: 5px; font-size: 0.9rem; }
        .info-card p { font-size: 0.8rem; color: #64748b; }
        .roadmap { background: white; border-radius: 25px; padding: 25px; border: 1px solid #eee; margin-top: 20px; border-left: 8px solid var(--bright-purple); }
        .step-list { list-style: none; margin-top: 10px; }
        .step-list li { font-size: 0.85rem; padding: 5px 0; display: flex; align-items: center; gap: 10px; }
        .step-list li::before { content: '⚡'; color: var(--bright-purple); }

        /* LIST & DETAIL STYLES */
        .list-item { background: white; padding: 1.2rem; margin-bottom: 12px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .list-item:hover { border-color: var(--bright-purple); background: rgb(250, 250, 255); }
        .content-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .section-title { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; margin: 20px 0 10px; display: block; color: #636e72; }
        .def-container { background: #fdf2ff; border-left: 6px solid #a855f7; padding: 20px; border-radius: 15px; margin-bottom: 20px; color: #6b21a8; }
        .algo-container { background: var(--algo-rgb); border-left: 6px solid var(--algo-border); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .code-window { background: rgb(30, 39, 46); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .code-header { background: rgba(0,0,0,0.2); padding: 12px 20px; display: flex; justify-content: flex-end; gap: 15px; }
        .emoji-btn { background: rgba(255,255,255,0.1); border: none; cursor: pointer; font-size: 1.2rem; border-radius: 50%; width: 40px; height: 40px; transition: 0.2s; }
        .emoji-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        pre { padding: 20px; overflow-x: auto; color: #dff9fb; font-family: 'Courier New', monospace; font-size: 0.95rem; }
        .points-container { background: #f8fafc; border-left: 6px solid #64748b; padding: 20px; border-radius: 15px; margin-bottom: 20px; color: #334155; }
        .explain-container { background: var(--explain-rgb); border-left: 6px solid var(--explain-border); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .video-container { background: var(--video-rgb); padding: 15px; border-radius: 20px; border: 2px solid var(--video-border); }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .sub-badge { background: #302b63; color: white; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="bg-animation"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<header>
    <div class="logo-text">Algonetic</div>
    <p style="font-size: 0.85rem; color: #64748b; font-weight: 600; letter-spacing: 1px;">BCA ACADEMIC HUB</p>
</header>

<div class="container">
    <button id="backBtn" class="back-btn" onclick="goBack()">← Back</button>
    <div id="viewArea"></div>
</div>

<script>
    const database = [
        {
            name: "Semester 1 & 2",
            style: "sem12",
            subjects: [
                { name: "C Language", programs: [] },
                { name: "HTML Projects", programs: [] }
            ]
        },
        {
            name: "Semester 3 & 4",
            style: "sem34",
            subjects: [
                { name: "Data Structures", 
				programs: [
				{
    title: "Sparse Matrix Check & Triplet Form",
    definition: "A Sparse Matrix is a table (grid) where most of the boxes contain '0'. Instead of wasting memory, we only store the actual numbers and their positions (Row and Column). This list of (Value, Row, Column) is called Triplet Form.",
    points: "• Rule: If Zeros > Non-Zeros, it is a Sparse Matrix.\n• Memory: It saves a lot of space in big databases.\n• Triplet Format: [Value] [Row Index] [Column Index].",
    algo: "Step 1: Get the number of Rows and Columns from the user.\nStep 2: Input the matrix elements.\nStep 3: Show the matrix and count the total zeros.\nStep 4: Calculate non-zero count (Total - Zeros).\nStep 5: If Zeros are more than actual numbers, print 'Sparse Matrix'.\nStep 6: Print only the actual numbers and their address.\nStep 7: End.",
    code: `#include<stdio.h>\n#include<conio.h>\n\nmain()\n{\n    int i, j, row, col, a[100][100], b[100][100], zeroCount = 0, nonZeroCount = 0;\n    printf("Enter Rows & Columns : ");\n    scanf("%d %d", &row, &col);\n\n    for(i = 0; i < row; i++) {\n        for(j = 0; j < col; j++) {\n            printf("Element [%d][%d] : ", i, j);\n            scanf("%d", &a[i][j]);\n        }\n    }\n\n    for(i = 0; i < row; i++) {\n        for(j = 0; j < col; j++) {\n            printf("%4d", a[i][j]);\n            if(a[i][j] == 0) zeroCount++;\n        }\n        printf("\\n");\n    }\n\n    nonZeroCount = (row * col) - zeroCount;\n    if(zeroCount > nonZeroCount) printf("Result : Sparse Matrix\\n");\n    else printf("Result : NOT Sparse Matrix\\n");\n\n    for(i = 0; i < row; i++) {\n        for(j = 0; j < col; j++) {\n            if(a[i][j] != 0) printf("%d %d %d\\n", a[i][j], i, j);\n        }\n    }\n}`,
    explain: "• Nested Loops: Used to scan every single box in the table.\n• zeroCount: Increments only when a '0' is found.\n• Final Filter: The 'if(a[i][j] != 0)' ensures we only see the important values.",
    video: "https://www.youtube.com/watch?v=L_TbeE53_Uo"
},
{
    title: "Insertion Sort",
    definition: "Insertion sort works just like sorting playing cards in your hand. You pick one card (number) and 'insert' it into its correct position among the already sorted cards.",
    points: "• Simple: Best for small lists.\n• Stability: Keeps the relative order of equal elements.\n• Space: Uses very little memory (In-place sorting).",
    algo: "Step 1: Start from the second number in the list.\nStep 2: Pick the number and compare it with numbers before it.\nStep 3: If the number before it is larger, shift that number to the right.\nStep 4: Insert your picked number into the empty gap.\nStep 5: Repeat for all numbers until the end.\nStep 6: Show the sorted list.",
    code: `#include<stdio.h>\n#include<conio.h>\nmain()\n{\n    int i, a[100], temp, p, no;\n    printf("Enter Total Numbers:");\n    scanf("%d",&no);\n    for(i=1;i<=no;i++) {\n        printf("Enter Value:");\n        scanf("%d",&a[i]);\n    }\n    a[0]=0;\n    for(i=1;i<=no;i++) {\n        p=i-1; temp=a[i];\n        while(temp < a[p]) {\n            a[p+1]=a[p];\n            p--;\n        }\n        a[p+1]=temp;\n    }\n    for(i=1;i<=no;i++) printf("%d\\t",a[i]);\n}`,
    explain: "• temp: Stores the current number we are trying to insert.\n• while loop: Moves other numbers to the right to make space for 'temp'.\n• a[p+1]: Places the number in its final sorted home.",
    video: "https://www.youtube.com/watch?v=yCxV0kBf_No"
},
{
    title: "Shell Sort",
    definition: "Shell Sort is a faster version of Insertion Sort. Instead of comparing neighbors, it compares numbers that are far apart using a 'Gap'. As the gap gets smaller, the list becomes more sorted.",
    points: "• Efficient: Much faster than basic Insertion Sort.\n• Gap Logic: Usually starts with Gap = Total Size / 2.\n• Diminishing: The gap reduces in every round until it becomes 1.",
    algo: "Step 1: Start with a big gap (Total Size / 2).\nStep 2: Compare elements at that distance.\nStep 3: If the left element is smaller than the right, swap them (for descending order in this code).\nStep 4: Reduce the gap by half.\nStep 5: Repeat until the gap is zero.\nStep 6: Print the sorted numbers.",
    code: `#include<stdio.h>\n#include<conio.h>\nmain()\n{\n    int no, a[100], i, gap, swap, temp;\n    printf("Enter Size:");\n    scanf("%d",&no);\n    for(i=0;i<no;i++) scanf("%d",&a[i]);\n    gap=no/2;\n    do {\n        do {\n            swap=0;\n            for(i=0;i<no-gap;i++) {\n                if(a[i] < a[i+gap]) {\n                    temp=a[i]; a[i]=a[i+gap]; a[i+gap]=temp;\n                    swap=1;\n                }\n            }\n        } while(swap);\n    } while(gap=gap/2);\n    for(i=0;i<no;i++) printf("%d\\t",a[i]);\n}`,
    explain: "• gap=no/2: Sets the initial jumping distance.\n• swap flag: Checks if any movement happened in the current pass.\n• Outer do-while: Shrinks the gap every time until the whole list is sorted.",
    video: "https://www.youtube.com/watch?v=9E_6DIn8S0Q"
},
{
    title: "Merge Sort Logic",
    definition: "Merge Sort follows the 'Divide and Conquer' rule. It takes two already sorted lists and merges them into one single, perfectly sorted list.",
    points: "• Reliable: Guaranteed to work fast even on huge data.\n• Logic: Compares the smallest of both lists and picks the winner.\n• Used In: Sorting massive databases and web search results.",
    algo: "Step 1: Take two sorted lists (List A and List B).\nStep 2: Compare the first numbers of both lists.\nStep 3: Put the smaller one into the Result list.\nStep 4: Move to the next number in that list and repeat.\nStep 5: If numbers remain in any list, copy them to the Result list.\nStep 6: Display the final combined sorted list.",
    code: `// This code sorts two lists using Bubble sort and then merges them.\n#include<stdio.h>\n// ... (User provided Merge function logic)\n// Full code handles merging two arrays into one 'res' array.`,
    explain: "• while(i < n && j < m): This ensures we stay inside both lists while comparing.\n• res[k]: This is our new, bigger list where we store the sorted items.\n• Residual loops: If one list finishes early, the remaining items of the other list are simply added to the end.",
    video: "https://www.youtube.com/watch?v=mB5HXB_K_M8"
},
{
    title: "Bubble Sort",
    definition: "Bubble Sort is the simplest sorting method. It compares two neighbors and swaps them if they are in the wrong order. The largest numbers 'bubble up' to the end of the list one by one.",
    points: "• Easy: The easiest sorting algorithm to write.\n• Passes: Each pass moves the next largest number to its correct spot.\n• Performance: Good for small lists, slow for big ones.",
    algo: "Step 1: Start from the first number.\nStep 2: Compare it with the next number.\nStep 3: If the current number is smaller than the next, swap them (for descending order).\nStep 4: Move to the next pair and repeat until the end.\nStep 5: After one full pass, the smallest number is at the end.\nStep 6: Repeat for all numbers.",
    code: `#include<stdio.h>\n#include<conio.h>\nmain()\n{\n    int no, a[100], i, j, swap;\n    printf("Enter Size:");\n    scanf("%d",&no);\n    for(i=0;i<no;i++) scanf("%d",&a[i]);\n    for(i=0;i<no-1;i++) {\n        for(j=0;j<no-i-1;j++) {\n            if(a[j] < a[j+1]) {\n                swap=a[j]; a[j]=a[j+1]; a[j+1]=swap;\n            }\n        }\n    }\n    for(i=0;i<no;i++) printf("%d ",a[i]);\n}`,
    explain: "• Outer Loop (i): Tells us how many passes we need to make.\n• Inner Loop (j): Handles the actual neighbor comparisons.\n• Swap: A temporary variable used to exchange two numbers without losing them.",
    video: "https://www.youtube.com/watch?v=nmhjrI-aW5o"
},
{
    title: "Linear Search",
    definition: "Linear Search is the most basic way to find something. It starts at the beginning of the list and checks every single item one by one until it finds the 'target' number.",
    points: "• Unsorted: Works even if the list is not sorted.\n• Simple: No complex math, just a single loop.\n• Efficiency: It takes more time if the target is at the very end.",
    algo: "Step 1: Ask the user for the list of numbers.\nStep 2: Ask the user for the number they want to find.\nStep 3: Start from the first number (index 0).\nStep 4: Check if current number == target.\nStep 5: If yes, say 'Found' and stop.\nStep 6: If you reach the end without finding it, say 'Not in list'.",
    code: `#include<stdio.h>\n#include<conio.h>\nmain()\n{\n    int no, find, i, a[100];\n    printf("Enter Size:");\n    scanf("%d",&no);\n    for(i=0;i<no;i++) scanf("%d",&a[i]);\n    printf("Search for:");\n    scanf("%d",&find);\n    for(i=0;i<no;i++) {\n        if(a[i] == find) {\n            printf("Value %d found at position %d", find, i+1);\n            break;\n        }\n    }\n    if(i==no) printf("No Is Not In A List");\n}`,
    explain: "• if(a[i] == find): This is the heart of the search, comparing every box to our target.\n• break: Once we find the number, we don't waste time checking the rest of the list.\n• i == no: If the loop finishes naturally without breaking, it means the number wasn't there.",
    video: "https://www.youtube.com/watch?v=466iJ69x298"
}
				] },
                { name: "C++ Programming", programs: [] }
            ]
        }
    ];

    let history = ['HOME'];
    const viewArea = document.getElementById('viewArea');
    const backBtn = document.getElementById('backBtn');

    function renderHome() {
        history = ['HOME']; backBtn.style.display = 'none';
        let html = `
            <div class="grid">
                ${database.map((g, i) => `<div class="card sem-card ${g.style}" onclick="renderSubjects(${i})"><h3>${g.name}</h3><p style="font-size:0.8rem; opacity:0.9;">Browse Codes</p></div>`).join('')}
            </div>

            <h3 class="info-header">Student Dashboard</h3>
            <div class="extra-section">
                <div class="info-card"><h4>🚀 Quick Copy</h4><p>One-click clipboard copy for all C, C++, and DFS.</p></div>
                <div class="info-card"><h4>💡 Logic-Centric</h4><p>Every code comes with a simplified step-by-step algorithm.</p></div>
                <div class="info-card"><h4>🎬 Visual Aids</h4><p>Integrated YouTube tutorials for complex logic visualization.</p></div>
            </div>

            <div class="roadmap">
                <h4>📚 Learning Roadmap</h4>
                <ul class="step-list">
                     <li>Semester 1: Mastering C Programming Basics</li>
                    <li>Semester 2: Advanced C & HTML Web Design</li>
                    <li>Semester 3: Data File AndStructures(DFS) & c++ </li>
                    <li>Semester 4: Object Oriented Programming (Java/C++)</li>
                </ul>
            </div>
        `;
        viewArea.innerHTML = html;
    }

    function renderSubjects(gIdx) {
        history.push({type:'GROUP', gIdx}); backBtn.style.display = 'block';
        let html = `<h2>${database[gIdx].name}</h2><div class="grid">`;
        database[gIdx].subjects.forEach((s, sIdx) => {
            html += `<div class="card" onclick="renderPrograms(${gIdx}, ${sIdx})"><h3>${s.name}</h3><p style="font-size:0.8rem; opacity:0.6;">View Program List</p></div>`;
        });
        viewArea.innerHTML = html + '</div>';
    }

    function renderPrograms(gIdx, sIdx) {
        history.push({type:'SUB', gIdx, sIdx});
        const sub = database[gIdx].subjects[sIdx];
        let html = `<h2>${sub.name}</h2>`;
        sub.programs.forEach((p, pIdx) => {
            html += `<div class="list-item" onclick="renderDetail(${gIdx}, ${sIdx}, ${pIdx})">${p.title} <span>VIEW →</span></div>`;
        });
        viewArea.innerHTML = html || "<p style='text-align:center; opacity:0.5;'>No programs here yet.</p>";
    }

    function renderDetail(gIdx, sIdx, pIdx) {
        history.push({type:'DETAIL'});
        const p = database[gIdx].subjects[sIdx].programs[pIdx];
        const subName = database[gIdx].subjects[sIdx].name;

        viewArea.innerHTML = `
            <div class="content-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2 style="color:#302b63; margin:0;">${p.title}</h2>
                    <span class="sub-badge">📚 ${subName}</span>
                </div>
                <span class="section-title">📖 Definition</span>
                <div class="def-container">${p.definition}</div>
                <span class="section-title">🧠 Algorithm</span>
                <div class="algo-container">${p.algo.replace(/\n/g, '<br>')}</div>
                <div class="code-window">
                    <div class="code-header">
                        <button class="emoji-btn" onclick="copyCurrentCode()">📋</button>
                        <button class="emoji-btn" onclick="shareCurrentPage('${p.title}')">🔗</button>
                    </div>
                    <pre><code id="codeToCopy">${p.code.replace(/</g, "&lt;")}</code></pre>
                </div>
                <span class="section-title">⭐ Important Points</span>
                <div class="points-container"><ul style="margin-left:20px;">${p.points.split('\n').map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <span class="section-title">📝 Explanation</span>
                <div class="explain-container">${p.explain.replace(/\n/g, '<br>')}</div>
                <div class="video-container"><div class="video-box"><iframe src="https://www.youtube.com/embed/${p.video}" allowfullscreen></iframe></div></div>
            </div>`;
    }

    function goBack() {
        history.pop();
        const prev = history[history.length - 1];
        if(prev === 'HOME') renderHome();
        else if(prev.type === 'GROUP') { history.pop(); renderSubjects(prev.gIdx); }
        else if(prev.type === 'SUB') { history.pop(); renderPrograms(prev.gIdx, prev.sIdx); }
    }

    function copyCurrentCode() { navigator.clipboard.writeText(document.getElementById('codeToCopy').innerText).then(() => alert("Copied!")); }
    function shareCurrentPage(title) { if(navigator.share) navigator.share({title: 'Algonetic: ' + title, url: window.location.href}); else alert("Link: " + window.location.href); }

    renderHome();
</script>
</body>
</html>
